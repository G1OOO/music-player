<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="player-card">
        <div class="album-art">
            <img src="ghost-town.png">
        </div>

        <div class="song-info">
            <h1 class="song-title">Ghost Town</h1>
            <p class="artist-name">Kanye West</p>
        </div>

        <div class="progress-area">
            <div class="progress-bar">
                <div class="progress-filled"></div>
                <div class="progress-knob"></div>
            </div>
            <div class="time-stamp">
                <span></span>
                <span>0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="secondary-btn"><i class="fas fa-backward-step"></i></button>
            <button class="main-btn"><i class="fas fa-play"></i></button>
            <button class="secondary-btn"><i class="fas fa-forward-step"></i></button>
        </div>
    </div>
</body>
</html>
